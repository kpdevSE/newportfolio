<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Kanishka Pasindu</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
        }
        
        .error-code {
            font-size: 120px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #0f0;
            animation: glitch 2s infinite;
        }
        
        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }
        
        p {
            font-size: 18px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .terminal {
            background: #111;
            border: 2px solid #0f0;
            border-radius: 5px;
            padding: 20px;
            margin: 30px 0;
            text-align: left;
        }
        
        .terminal-line {
            margin: 10px 0;
        }
        
        .prompt {
            color: #0f0;
        }
        
        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background: #0f0;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .btn {
            display: inline-block;
            padding: 15px 30px;
            background: transparent;
            color: #0f0;
            border: 2px solid #0f0;
            text-decoration: none;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .btn:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 20px #0f0;
        }
        
        @media (max-width: 768px) {
            .error-code {
                font-size: 80px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1>PAGE NOT FOUND</h1>
        <p>The page you're looking for doesn't exist in this system.</p>
        
        <div class="terminal">
            <div class="terminal-line">
                <span class="prompt">root@kpdev:~$</span> locate page
            </div>
            <div class="terminal-line">
                > Error: Page not found in database
            </div>
            <div class="terminal-line">
                <span class="prompt">root@kpdev:~$</span> return home
            </div>
            <div class="terminal-line">
                > Redirecting to main system<span class="cursor"></span>
            </div>
        </div>
        
        <a href="/" class="btn">./return_home.sh</a>
    </div>
    
    <script>
        // Auto redirect after 10 seconds
        setTimeout(() => {
            window.location.href = '/';
        }, 10000);
    </script>
</body>
</html>
